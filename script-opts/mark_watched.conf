# mark_watched.lua options
#
# Copy this file to ~/.config/mpv/script-opts/mark_watched.conf and
# uncomment/edit as needed. mpv only reads the top-level script-opts/ dir,
# never the copy inside plugins/ - this file just documents the defaults.

#enabled=yes

# Which algorithm decides when a video counts as "watched":
#   threshold - fires once EITHER min_seconds or min_percent (below) is
#               reached, whichever comes first. See `profile` for named
#               presets instead of hand-tuning the two numbers.
#   adaptive  - the percent-watched target scales with the video's own
#               duration instead of a flat number - see the adaptive_*
#               options below.
#algorithm=threshold

# --- threshold algorithm ---
#
# A named preset for min_seconds/min_percent - every value below other
# than "custom" ignores min_seconds/min_percent and uses its own preset
# pair instead:
#
#   immediate       - marks watched on the very first position update
#                      (min_seconds=0, min_percent=0)
#   seconds_only    - only min_seconds matters (min_percent effectively
#                      disabled: min_seconds=30, min_percent=101)
#   percent_only    - only min_percent matters (min_seconds effectively
#                      disabled: min_seconds=1e9, min_percent=50)
#   balanced        - the default: min_seconds=30, min_percent=50
#   near_completion - only counts near the very end (min_seconds=1e9,
#                      min_percent=90)
#   custom          - use the min_seconds/min_percent values below as-is
#profile=balanced

# Only used when profile=custom above.
#min_seconds=30
#min_percent=50

# --- adaptive algorithm ---
#
# target_percent slides linearly between adaptive_short_percent (at or
# below adaptive_short_minutes of duration) and adaptive_long_percent (at
# or above adaptive_long_minutes), clamped at both ends - short videos
# need a bigger fraction watched to count, long ones a smaller one.
# adaptive_min_seconds is a floor under that percent target, for
# degenerate very-short-duration edge cases.
#adaptive_short_minutes=2
#adaptive_short_percent=70
#adaptive_long_minutes=20
#adaptive_long_percent=15
#adaptive_min_seconds=5
